name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
              with:
                  enable-cache: true
                  python-version: "3.12"
            # sounddevice needs the system PortAudio library on Linux, the
            # streaming tests decode through ffmpeg, and the GUI modules import
            # tkinter, which Ubuntu's system Python ships separately.
            - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg python3-tk
            - run: uv sync --locked --group dev
            - run: uv run ruff check .
            - run: uv run pyright
            - run: uv run pytest -q
