plan_id: settings-modernize-20260409
objective: Modernize the Settings tabs so they visually align with the main window UI without changing navigation or content structure.
created_at: "2026-04-09T00:00:00Z"
created_by: gem-team:gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 5
  risk_score: medium

tldr: |
  This remains a medium-complexity styling pass, not a navigation rewrite.
  The plan still starts with shared settings-shell and BaseTab primitives, but that foundation now explicitly includes an adoption audit showing which tabs can consume shared styling directly and which need manual adapters.
  Card treatment is now bounded to top-level section containers so inner rows, textboxes, lists, and dynamic panels do not get double-boxed or visually louder than the main window.
  Final validation now includes accessibility checks (contrast, focus visibility, readability, nested-surface differentiation), structural invariants (tab order, sidebar anchor order, section-header order, Coqui visibility), and long-tab scroll behavior. Documentation updates are conditional on finding a real mismatch.

acceptance_criteria:
  - id: "AC-007"
    description: "All settings tabs use section containers and surface treatment that mostly match the main window's card-style presentation, spacing rhythm, and surface colors."
  - id: "AC-008"
    description: "Tab names, tab order, section ordering, and existing control content remain unchanged after the styling update."
  - id: "AC-009"
    description: "The settings window adopts a restrained visual refresh that feels close to the main window without louder accent usage, dense chrome, or distracting decoration."
  - id: "AC-010"
    description: "Voice, Audio Output, Appearance, Abbreviations, Keybinds, Behavior, Soundboard, VRChat OSC, Advanced, and TTS Provider tabs all receive the same settings-surface alignment treatment for their section containers."

open_questions: []

verification_invariants:
  tab_order:
    - Voice
    - Audio Output
    - Appearance
    - Abbreviations
    - Keybinds
    - Behavior
    - Soundboard
    - VRChat OSC
    - Advanced
    - TTS Provider
  sidebar_anchor_order:
    - tab: Appearance
      anchors: ["Appearance Mode", "Visible Buttons"]
    - tab: Audio Output
      anchors: ["Output Device", "Device Information", "Audio Normalization", "Microphone Passthrough"]
    - tab: Abbreviations
      anchors: ["Abbreviations", "Usage Tips"]
    - tab: Keybinds
      anchors: ["Keybinds"]
    - tab: Behavior
      anchors: ["Behavior", "Text Transcription", "Transcription Refinement", "Audio Pre-processing", "Word Corrections"]
    - tab: Soundboard
      anchors: ["Soundboard"]
    - tab: Voice
      anchors: ["★ Favorite Voices", "Recent Voices"]
    - tab: VRChat OSC
      anchors: ["VRChat OSC Chatbox", "VRChat Viseme Lip-Sync", "Typing Indicator"]
    - tab: Advanced
      anchors: ["Cache Management", "Network Privacy", "Performance Settings", "Experimental Features"]
    - tab: TTS Provider
      anchors: ["Active Provider", "Provider Details"]
  conditional_visibility:
    - "The Coqui-only settings frame in TTS Provider stays hidden for non-Coqui providers and reappears immediately after the Provider Details separator when Coqui is selected."
  interaction_invariants:
    - "Sidebar anchor count and order remain unchanged per tab and still target the matching section header through BaseTab._scroll_to_section()."
    - "Scroll-to-section behavior continues to land close to the intended header even when the header lives inside nested frames."
    - "Long tabs remain vertically scrollable after the refresh, including Voice favorites/recent lists and Advanced cache/status content."

