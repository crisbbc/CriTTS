pattern_risk_matrix:
  - pattern: standard-form
    coverage: "Direct shared shell/base helper adoption with stable section-header order and restrained top-level card treatment."
    primary_risk: "Shared wrappers could still alter spacing rhythm or section-header readability if applied too mechanically."
  - pattern: row-heavy
    coverage: "Only outer section containers change; inner utility rows stay transparent and keep current widths/alignment."
    primary_risk: "Row clusters can become cramped or noisy if inner controls inherit card styling."
  - pattern: textbox-heavy
    coverage: "Shared sections plus targeted textbox/readability alignment."
    primary_risk: "Textbox and warning surfaces may lose contrast or nested-surface readability after the refresh."
  - pattern: dynamic-and-scroll-heavy
    coverage: "Shared top-level surfaces plus explicit adapters for nested scrollables, info panels, and long-tab behavior."
    primary_risk: "Nested scroll areas or sidebar jumps can regress even if the static layout looks correct."
  - pattern: stacked-mixed-controls
    coverage: "Shared section framing with minimal subsection spacing adapters."
    primary_risk: "Mixed controls can look over-grouped if every subsection receives equal card emphasis."
  - pattern: conditional
    coverage: "Shared section framing with explicit preservation of Coqui-only visibility and anchor boundaries."
    primary_risk: "Conditional sections can accidentally gain anchors, shift placement, or feel double-boxed."

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "The foundation assumes shared helpers can solve every tab, so row-heavy, textbox-heavy, conditional, or dynamic tabs regress because they needed explicit adapters."
      likelihood: medium
      impact: high
      mitigation: "Make the wave-1 foundation produce a tab/pattern adoption audit and route wave-2 work through that audit instead of treating helper reuse as universal."
    - scenario: "Card treatment expands to every nested frame, row, or note, making the refresh louder than the main window and creating double-boxed sections."
      likelihood: medium
      impact: medium
      mitigation: "Define card boundaries up front: wrap top-level sections only, keep inner rows transparent by default, and retain secondary surfaces only where they already communicate structure."
    - scenario: "Surface-color or focus-treatment updates reduce contrast, obscure focus state, or make nested surfaces hard to distinguish."
      likelihood: medium
      impact: high
      mitigation: "Add explicit accessibility validation for contrast, focus visibility, readability, and nested-surface differentiation before the refresh is approved."
    - scenario: "New wrappers or padding shifts break sidebar anchor targeting, conditional Coqui placement, or long-tab scroll behavior."
      likelihood: medium
      impact: high
      mitigation: "Validate tab order, sidebar anchor count/order, section-header order, Coqui visibility, scroll-to-section behavior, and long-tab scrolling in the final review gate."
  assumptions:
    - "docs/PRD.yaml is the source of truth for scope and limits."
    - "src/gui/main_window.py and src/gui/theme_constants.py define the main-window spacing and surface language that settings should follow closely."
    - "The current tab order and section-header order in src/gui/settings_window.py and src/gui/settings_tabs/*.py are the invariants that must be preserved."
    - "README.md should only change if the shipped settings wording or navigation description becomes inaccurate after the refresh."

implementation_specification:
  code_structure: "Centralize the modernization in shared styling leverage points first, but treat that foundation as both a styling layer and an audit artifact. Wave 1 should deliver shared shell/base helpers, a tab/pattern adoption map saying which tabs can consume them directly versus which need manual adapters, and explicit card-boundary rules limiting card treatment to top-level section containers. Wave 2 should then apply direct reuse where safe and targeted adapters where needed, preserving plain inner rows, textboxes, lists, notes, and conditional blocks unless an existing secondary surface already provides meaning."
  affected_areas:
    - "src/gui/theme_constants.py"
    - "src/gui/settings_window.py"
    - "src/gui/settings_tabs/base_tab.py"
    - "src/gui/settings_tabs/"
    - "README.md (conditional only if validation finds wording drift)"
  component_details:
    - component: "Settings window shell"
      responsibility: "Align the top-level settings window, tabview chrome, and action-bar spacing with the main window's quieter surfaces and spacing without changing the tab model or button behavior."
      interfaces:
        - "SettingsWindow._create_window()"
        - "CustomTkinter tabview and container styling"
    - component: "Shared settings section surface helpers"
      responsibility: "Provide reusable section wrappers, section-heading treatment, muted description styling, separator behavior, and spacing tokens that tabs can share without rewriting content order."
      interfaces:
        - "BaseTab.setup_layout()"
        - "BaseTab.create_section_header()"
        - "BaseTab.create_description()"
        - "BaseTab.create_separator()"
    - component: "Adoption audit and adapter map"
      responsibility: "Classify each tab and section pattern as direct shared-styling reuse versus manual-adapter work so downstream tasks do not assume the helpers are sufficient everywhere."
      interfaces:
        - "Tab coverage matrix for Appearance, Audio Output, Abbreviations, Keybinds, Behavior, Soundboard, Voice, VRChat OSC, Advanced, and TTS Provider"
        - "Card-boundary rules for top-level versus nested surfaces"
    - component: "Tab-specific adapters"
      responsibility: "Apply minimal manual restructuring only where nested frames, textboxes, row-heavy layouts, conditional content, or dynamic panels need explicit styling alignment after the shared foundation lands."
      interfaces:
        - "VoiceTab._create_*_section()"
        - "AdvancedTab._create_*_section()"
        - "TTSProviderTab._create_content()"
        - "VRChatOSCTab._create_*_section()"
        - "Representative row/textbox-heavy builders in src/gui/settings_tabs/"
  dependencies:
    - component: "Shared settings section surface helpers"
      relationship: "Depend on main-window theme tokens so settings can reuse existing spacing and surface decisions instead of introducing a second visual language."
    - component: "Adoption audit and adapter map"
      relationship: "Depends on the current settings tab implementations so the plan can preserve existing header order, sidebar anchors, and conditional visibility while deciding where helpers are enough."
    - component: "Tab-specific adapters"
      relationship: "Depend on both the shared helper contract and the adoption audit so only tabs that need manual handling receive it."
  integration_points:
    - "Settings window creation and tabview layout in src/gui/settings_window.py"
    - "Shared tab layout primitives in src/gui/settings_tabs/base_tab.py"
    - "Main-window style tokens in src/gui/theme_constants.py"
    - "Individual settings tab section builders in src/gui/settings_tabs/"
    - "README Settings section only if validation confirms a documentation mismatch"

contracts:
  - from_task: settings-surface-foundation
    to_task: settings-standard-tabs-alignment
    interface: "Shared shell/base primitives plus an adoption audit marking which standard, row-heavy, and textbox-heavy tabs can use the shared treatment directly and which need lightweight adapters."
    format: "Python helper contract plus tab coverage matrix and card-boundary rules"
  - from_task: settings-surface-foundation
