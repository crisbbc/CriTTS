created_by: gem-team:gem-planner
status: pending
research_confidence: high
plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 8
  risk_score: medium
tldr: |
  Keep Phase 5 surgical and behavior-preserving.
  Wave 1 removes avoidable main-window and settings-shell work without changing control sets, tab order, section order, or latest-wins editor behavior.
  The approved low-risk Wave 1 scope keeps quick controls eagerly created, and treats Voice, Advanced, and TTS Provider as dependency-critical tabs that hydrate during shell build while other tabs remain lazy-on-selection.
  Wave 2 only gates redundant Apply-triggered refresh scheduling around true no-op cases while keeping refresh_theme as the canonical rebuild path.
  Wave 3 simplifies special-tab adapter paths through shared helpers without expanding scope beyond the current PRD and existing regression envelope.
  Final validation runs only the existing pytest suites that already lock contrast, 44px controls, tab/section order, persistence rollback, and latest-wins behavior.
open_questions: []
gaps: []
pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Wave 1 hydration omits a dependency-critical tab and breaks first-load side effects for Voice, Advanced, or TTS Provider content.
      likelihood: medium
      impact: high
      mitigation: Preserve SETTINGS_TAB_ORDER, eagerly hydrate Voice, Advanced, and TTS Provider during shell build, hydrate the initially selected tab if different, and keep the current opening refresh/provider-callback contract covered by existing settings-window tests.
    - scenario: Apply/no-op refresh gating suppresses a rebuild that refresh_theme still needs to perform for settings content.
      likelihood: medium
      impact: high
      mitigation: Limit optimization to deduplicating Apply-triggered refresh scheduling for true no-op cases, keep selected-tab preservation intact, and preserve refresh_theme as the unchanged destroy-children plus _build_window_content(selected_tab=...) rebuild path validated by the existing regression suite.
    - scenario: Main-window quick-control shortcuts accidentally change persistence rollback or visible control behavior.
      likelihood: medium
      impact: high
      mitigation: Keep rollback semantics unchanged, short-circuit only true no-op saves/layout work, and rerun the existing latest-wins and quick-control persistence tests.
  assumptions:
    - docs/PRD.yaml remains the source of truth for behavior preservation, subtle styling, and no-restructure scope.
    - src/gui/theme_constants.py and src/gui/settings_tabs/base_tab.py are the canonical shared token/helper layers for desktop UI styling.
    - Existing pytest suites already encode the critical invariants for tab order, section order, contrast, 44px button height, latest-wins editor behavior, and persistence rollback.
    - The optimization should not add tabs, reorder sections, rename controls, or introduce new user-facing settings.
implementation_specification:
  code_structure: Keep changes localized to the existing desktop UI composition points. Main-window optimization should stay inside MainWindow quick-controls/control-bar helpers without introducing lazy quick-controls creation. Settings optimization should preserve SETTINGS_TAB_ORDER while eagerly hydrating dependency-critical Voice, Advanced, and TTS Provider tabs, lazily hydrating non-critical tabs on selection, gating Apply-triggered refresh scheduling only around true no-op cases, and resolving shared surface tokens once per relevant render path; refresh_theme remains the canonical rebuild path with unchanged destroy-children plus _build_window_content(selected_tab=...) semantics.
  affected_areas:
    - src/gui/main_window.py
    - src/gui/settings_window.py
    - src/gui/settings_tabs/base_tab.py
    - src/gui/settings_tabs/voice_tab.py
    - src/gui/settings_tabs/advanced_tab.py
    - src/gui/settings_tabs/vrchat_osc_tab.py
    - src/gui/settings_tabs/tts_provider_tab.py
    - tests/test_main_window_latest_wins.py
    - tests/test_voice_tab_provider_reload.py
    - tests/test_settings_surface_foundation.py
    - tests/test_settings_special_tabs_alignment.py
    - tests/test_settings_wave2_retry3_regressions.py
  component_details:
    - component: Main window control bar and quick controls
      responsibility: Remove duplicated and no-op work from the quick-controls/control-bar path while preserving the same visible controls, toggle behavior, slider semantics, and latest-wins text analysis behavior.
      interfaces:
        - MainWindow._create_quick_controls()
        - MainWindow.refresh_quick_controls()
        - MainWindow.refresh_status()
        - MainWindow._persist_quick_control_value()
        - MainWindow._update_quick_controls_provider()
        - MainWindow.apply_theme()
      dependencies:
        - component: SettingsManager persistence
          relationship: Persists quick-control and overlay settings and must keep rollback behavior intact on save failure.
      integration_points:
        - Main window control bar button creation
        - Quick-controls toggle and slider callbacks
        - Existing latest-wins and persistence rollback tests
    - component: Settings window shell
      responsibility: Preserve tab order and control structure while eagerly hydrating dependency-critical Voice, Advanced, and TTS Provider tabs, lazily deferring only non-critical tab creation, and deduplicating only redundant Apply-triggered refresh scheduling for behavior-preserving no-op flows.
      interfaces:
        - SettingsWindow._build_window_content()
        - SettingsWindow._collect_and_save()
        - SettingsWindow.refresh_theme()
      dependencies:
        - component: Shared settings tab helpers
          relationship: Supplies shared section surfaces, spacing, and appearance-aware theme tokens to hydrated tabs.
      integration_points:
        - SETTINGS_TAB_ORDER contract
        - VoiceTab live provider callback wiring
        - AdvancedTab opening refresh flow
    - component: Shared settings surface helpers
      responsibility: Resolve reusable surface/theme/spacing data once per render path and expose helper hooks that special tabs can adopt without changing section anchors or control content.
      interfaces:
        - BaseTab.get_active_surface_theme()
        - BaseTab.get_section_surface_style()
        - BaseTab.create_section_header()
        - BaseTab.create_description()
        - BaseTab.create_helper_text()
      dependencies:
        - component: Theme constants
          relationship: Provides centralized appearance-aware tokens for settings shells, sections, and nested readable surfaces.
      integration_points:
        - Standard settings tabs
        - Voice, Advanced, VRChat OSC, and TTS Provider special adapters
contracts:
  - from_task: ui-main-window-fast-path
    to_task: ui-regression-validation
    interface: Quick controls and control-bar buttons keep the same visible control set, rollback semantics, and latest-wins editor behavior while eliminating only no-op or duplicated work and keeping quick-controls creation eager.
    format: Existing main-window pytest assertions and behavior-preservation checklist
  - from_task: ui-settings-tab-hydration
    to_task: ui-settings-apply-fast-path
    interface: Settings tabs are created in SETTINGS_TAB_ORDER, Voice/Advanced/TTS Provider hydrate during shell build as dependency-critical tabs, the initially selected tab is also hydrated if different, and existing opening refresh/provider-callback behavior remains available to later Apply-triggered refresh gating without changing refresh_theme rebuild semantics.
    format: SettingsWindow hydration contract and current regression tests
  - from_task: ui-settings-apply-fast-path
    to_task: ui-special-tab-adapters-dynamic
    interface: Shared settings-shell/theme helpers expose stable appearance-aware section tokens so special tabs can reduce manual adapter churn without changing anchors or section order.
    format: BaseTab helper contract and settings-surface regression tests
  - from_task: ui-settings-apply-fast-path
    to_task: ui-special-tab-adapter-provider
    interface: Provider-tab styling updates must preserve the two top-level sidebar anchors and conditional Coqui visibility rules while consuming shared helper styles.
    format: TTS Provider anchor/visibility contract
