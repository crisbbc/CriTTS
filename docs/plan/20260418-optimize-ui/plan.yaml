    diagnosis:
      root_cause: SettingsWindow._build_window_content currently constructs more tab objects up front than necessary even though only Voice, Advanced, and TTS Provider are dependency-critical at shell build time.
      fix_recommendations: Preserve the existing tab shell and order but add a small tab-factory/hydration layer that eagerly instantiates Voice, Advanced, and TTS Provider, then lazily materializes the remaining tabs when selected.
