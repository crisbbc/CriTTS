      Keep the main window behavior identical while removing avoidable UI churn from the quick-controls path.
      Target the researched hot spots together: centralize duplicated button styling for the control bar, short-circuit broad refresh calls when only unrelated status data changed, skip provider-layout work when the visible slider layout is already correct, and avoid redundant slider persistence when the rounded value did not actually change.
    wave: 1
    agent: gem-team:gem-implementer
    prototype: false
    covers:
      - behavior-preserving
      - latest-wins
      - 44px-controls
    priority: high
    status: pending
    flags:
      flaky: false
      retries_used: 0
    dependencies: []
    conflicts_with: []
    context_files:
      - path: src/gui/main_window.py
        description: Owns the control bar, quick-controls panel, refresh path, theme application, and slider persistence hot path.
      - path: tests/test_main_window_latest_wins.py
        description: Locks quick-controls recolor, rollback, overlay toggle rollback, and latest-wins editor behavior.
    diagnosis:
      root_cause: Quick controls and related buttons still pay duplicated styling, broad refresh, no-op provider layout, and redundant save work inside the main window path.
      fix_recommendations: Keep the current UI structure and eager quick-controls creation, but add no-op guards and shared styling helpers inside MainWindow rather than redesigning the control bar.
      injected_at: "2026-04-18T00:00:00Z"
    planning_pass: 1
    planning_history:
      - pass: 1
        reason: MainWindow already contains most of the identified no-op churn in one place, making it the highest-impact low-risk fast path.
        timestamp: "2026-04-18T00:00:00Z"
    estimated_effort: medium
    estimated_files: 2
    estimated_lines: 240
    focus_area: main window quick controls
    verification:
      - python -m pytest -q tests/test_main_window_latest_wins.py
    acceptance_criteria:
      - The main window still exposes the same control bar buttons and quick-controls sliders with no control additions, removals, or reordering.
      - Quick-controls persistence rollback behavior stays unchanged when settings saves fail.
      - Latest-wins voice-indicator scheduling and current user-visible typing behavior remain unchanged.
    failure_modes:
      - scenario: Main-window fast-path cleanup accidentally skips a required quick-controls theme or visibility sync after a real state change.
        likelihood: medium
        impact: high
        mitigation: Keep the existing eager creation path, and preserve refresh_quick_controls as the single post-save source of truth for visibility and theming sync.
      - scenario: No-op guards suppress a required refresh after a real provider or settings change.
