    covers: [AC-3, AC-4, AC-5]
    priority: high
    status: pending
    dependencies: []
    conflicts_with: []
    context_files:
      - path: src/tts/tts_engine.py
        description: Owns active-provider resolution and currently calls AudioCache.lookup/store with processed text and resolved voice only.
      - path: src/tts/audio_cache.py
        description: Generates disk cache keys from text, voice, rate, volume, and pitch, and persists the cache index/version.
      - path: tests/test_tts_engine_cache.py
        description: Existing cache-oriented TTSEngine regressions are the right home for provider/voice cache-scope coverage.
    planning_pass: 1
    planning_history:
