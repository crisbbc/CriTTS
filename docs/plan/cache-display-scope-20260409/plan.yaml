plan_id: cache-display-scope-20260409
objective: Fix cache statistics so they render without a manual refresh, and scope cached speech per provider and voice so identical phrases do not reuse audio across incompatible TTS configurations.
created_at: 2026-04-09T00:00:00Z
created_by: github-copilot-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 2
  risk_score: medium

tldr: |
  Two localized fixes are needed.
  First, the Advanced settings cache panel needs an initial data-load hook so stats appear when the window opens instead of only after pressing Refresh.
  Second, audio cache identity must include the active provider as well as the resolved voice so the same phrase does not reuse cached audio across different providers or voice selections.
  docs/PRD.yaml exists but currently describes an earlier performance-optimization effort rather than this cache bugfix, and no root AGENTS.md was found during planning.

acceptance_criteria:
  - id: AC-1
    description: Opening Settings shows populated cache statistics in the Advanced tab without requiring the Refresh Statistics button.
  - id: AC-2
    description: Clearing cache or reopening Settings keeps the Advanced cache display synchronized with the current cache state.
  - id: AC-3
    description: Speaking the same phrase with a different TTS provider does not return cached audio created under another provider.
  - id: AC-4
    description: Speaking the same phrase with a different voice under the same provider does not return cached audio created for another voice.
  - id: AC-5
    description: Existing cache behavior for same text plus same provider plus same voice remains intact, and focused regression tests cover the UI and cache-scoping paths.

open_questions: []

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: The Advanced tab refresh hook runs before its widgets exist and leaves the settings window blank or throws during startup.
      likelihood: medium
      impact: medium
      mitigation: Trigger the first stats refresh only after AdvancedTab content is built, and cover the initialization path with a focused SettingsWindow/AdvancedTab regression test.
    - scenario: Provider-aware cache changes keep reusing old provider-agnostic disk entries and still surface stale audio for the wrong provider or voice.
      likelihood: medium
      impact: high
      mitigation: Version the cache key/index format, thread provider identity through lookup/store paths, and add regression tests that prove cross-provider and cross-voice requests miss while same-provider same-voice requests still hit.
  assumptions:
    - The user request is the source of truth for this bugfix because docs/PRD.yaml does not describe the cache-display or cache-scoping issue.
    - The safest migration path is to invalidate or segregate provider-agnostic cache keys rather than attempting a lossy on-disk migration.
    - The fix should remain localized to settings UI refresh flow, TTSEngine cache calls, and AudioCache persistence behavior.

implementation_specification:
  code_structure: Keep the change narrow. Use the existing SettingsWindow-to-tab refresh pattern for the cache display, and extend the current TTSEngine-to-AudioCache contract so cache identity is keyed by normalized text, resolved voice, active provider, and synthesis modifiers. Preserve current UI layout and current cache-management controls.
  affected_areas:
    - src/gui/settings_window.py
    - src/gui/settings_tabs/advanced_tab.py
    - src/tts/tts_engine.py
    - src/tts/audio_cache.py
    - tests/test_voice_tab_provider_reload.py
    - tests/test_tts_engine_cache.py
  component_details:
    - component: Advanced cache statistics panel
      responsibility: Populate the cache statistics textbox when the settings experience initializes and after explicit cache-management actions, without requiring a manual refresh click.
      interfaces:
        - "SettingsWindow._on_refresh()"
        - "AdvancedTab._on_refresh_cache_stats()"
        - "AdvancedTab optional tab-level load hook"
    - component: Provider-aware audio cache identity
      responsibility: Ensure cached audio lookup, storage, and any related phrase-cache bookkeeping distinguish entries by provider and voice so only compatible speech is reused.
      interfaces:
        - "AudioCache.lookup(...)"
        - "AudioCache.store(...)"
        - "AudioCache._generate_key(...)"
        - "TTSEngine.generate_speech(...)"
        - "TTSEngine.pregenerate_common_phrases(...)"
  dependencies:
    - component: Advanced cache statistics panel
      relationship: Reads current cache statistics from TTSEngine and depends on SettingsWindow calling the tab refresh hook after tab creation.
    - component: Provider-aware audio cache identity
      relationship: Receives the active provider from TTSEngine and persists provider-scoped metadata inside AudioCache.
  integration_points:
    - SettingsWindow initialization and refresh flow
    - AdvancedTab cache statistics textbox and clear-cache button flow
    - TTSEngine generate_speech cache lookup/store path
    - TTSEngine pre-generation path for common phrases
    - Existing pytest suites for settings-window reload behavior and TTS engine cache behavior

contracts:
  - from_task: cache-display-initial-load
    to_task: cache-bugfix-verification
    interface: Opening Settings or clearing cache yields an already-populated Advanced cache statistics textbox that reflects current engine state without a manual button press.
    format: CustomTkinter settings-window lifecycle plus focused pytest assertions
  - from_task: cache-provider-voice-scoping
    to_task: cache-bugfix-verification
    interface: Cache lookup/store only hits when text, active provider, resolved voice, and synthesis modifiers all match; cross-provider or cross-voice reuse must miss.
    format: Python cache-contract regression tests and cache-version invariant

