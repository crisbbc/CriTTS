        acceptance_criteria:
          - AudioCache keys and persisted metadata include provider identity in addition to text, voice, and synthesis modifiers.
          - TTSEngine passes the active provider consistently to cache lookup/store paths.
          - Old provider-agnostic cache entries cannot satisfy new provider-aware lookups.
