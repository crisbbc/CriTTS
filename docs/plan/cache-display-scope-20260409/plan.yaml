            likelihood: medium
            impact: high
            mitigation: Resolve provider once per generation request inside TTSEngine and pass the same value through both lookup and store.
          - scenario: Cache-version handling leaves old disk entries visible and the bug survives after upgrade.
            likelihood: medium
            impact: high
            mitigation: Bump cache version or segregate keys so provider-aware code never matches provider-agnostic entries, and cover the behavior with cache regression tests.
