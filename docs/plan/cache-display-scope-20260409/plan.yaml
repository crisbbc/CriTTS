      Treat this as a cache-identity fix rather than a feature change: preserve same-provider same-voice hits, but prevent cross-provider and cross-voice reuse by threading provider identity through TTSEngine and AudioCache and by invalidating old provider-agnostic cache keys safely.
    wave: 1
