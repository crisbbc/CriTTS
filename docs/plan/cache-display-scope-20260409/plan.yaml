        reason: The wrong-audio bug is rooted in cache identity and must be fixed where TTSEngine and AudioCache decide whether a request is a hit or miss.
        timestamp: 2026-04-09T00:00:00Z
        estimated_effort: medium
        estimated_files: 3
        estimated_lines: 220
        focus_area: audio cache identity
        verification:
