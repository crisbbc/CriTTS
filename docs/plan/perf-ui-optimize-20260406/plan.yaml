        failure_modes:
          - scenario: Tests pass but manual smoke or measurable gates still show noticeable lag, retained memory, or behavior drift.
            likelihood: medium
            impact: medium
            mitigation: Treat both the perf gate and the smoke matrix as release blockers and loop findings back into a follow-up perf-only patch rather than widening the current scope.
    requires_review: true
    review_depth: standard
    review_security_sensitive: false
