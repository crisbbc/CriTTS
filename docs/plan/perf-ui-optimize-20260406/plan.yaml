      - customtkinter
      - coqui-tts
      - piper-tts
    test_coverage: Extend provider cache/provider reload regression checks if lazy initialization changes public behavior.

  - id: perf-gui-input-throttle
    title: Use incremental current-line highlighting and latest-wins text analysis scheduling
    description: |
      Reduce typing lag by replacing full-document current-line retagging with incremental updates limited to the old/new active line and by scheduling expensive voice-indicator language analysis with latest-wins semantics during burst edits.
      Keep visible behavior stable: the current line stays highlighted correctly during caret moves, and typing animation plus Enter/Shift+Enter semantics remain unchanged.
    wave: 1
    agent: gem-implementer
    prototype: false
    covers: [AC4, AC6]
    priority: high
    status: completed
    dependencies: []
    conflicts_with:
      - perf-audio-single-decode
    context_files:
      - path: src/gui/main_window.py
        description: _on_text_changed, _update_voice_indicator, _highlight_current_line, and key bindings currently run on every edit.
    planning_pass: 1
    planning_history:
      - pass: 1
        reason: UI-thread work on every keypress is the clearest source of sluggish typing and is safe to optimize with scheduling changes.
        timestamp: 2026-04-06T00:00:00Z
        estimated_effort: small
        estimated_files: 1
        estimated_lines: 140
        focus_area: text input responsiveness
        verification:
          - Run: python -m pytest -q tests/test_voice_tab_provider_reload.py
          - Extract or isolate a small scheduler helper/state token path that can be unit-tested headlessly for latest-wins behavior under burst edits, proving stale scheduled analyses cannot overwrite the newest text state.
          - Manually type and paste a long multi-line block in the main textbox; confirm the current-line highlight tracks the active line correctly and the voice indicator settles to the latest text state within a short debounce window after burst edits.
        acceptance_criteria:
          - Text edits allow at most one pending expensive analysis update per burst, and only the latest scheduled result may update the voice indicator.
          - Current-line highlighting updates only the previously active line and the newly active line instead of removing/reapplying tags across the full document.
          - A focused helper/unit test deterministically proves latest-wins scheduling behavior for overlapping deferred analyses without requiring a broad GUI test harness.
          - Typing animation, keyboard shortcuts, and text entry semantics remain unchanged.
        failure_modes:
          - scenario: Debounce delay makes the voice indicator or highlight feel stale during normal typing.
            likelihood: medium
            impact: medium
            mitigation: Use short debounce windows, keep current-line movement incremental, and smoke-test both single-keystroke and paste flows.
          - scenario: An older scheduled analysis result overwrites a newer edit state after burst typing.
            likelihood: medium
            impact: medium
            mitigation: Use generation tokens or equivalent latest-wins bookkeeping so only the newest scheduled analysis can commit UI state.
          - scenario: Event binding changes interfere with Enter or text-edit shortcuts.
            likelihood: low
            impact: high
            mitigation: Keep existing shortcut bindings intact and verify Enter/Shift+Enter plus standard edit shortcuts manually.
    tech_stack:
      - Python
      - customtkinter
      - tkinter
    test_coverage: Keep manual smoke coverage, but require a small extracted helper or equivalent state-token seam for headless latest-wins unit coverage without widening scope.

  - id: perf-provider-memory-lifecycle
    title: Apply committed-change-only provider unload rules and bounded model eviction
    description: |
      Add a small, explicit offline-provider memory policy rather than a large lifecycle framework: release Coqui model state only when the provider change is committed or caches are explicitly cleared, and keep provider_override preview reads metadata-only so unsaved settings changes do not load or unload heavy state.
      Reuse the existing clear_cache hooks, guard against clearing model state while synthesis or preload is still in flight, and bound Piper's loaded voice models with deterministic eviction rather than unbounded retention.
    wave: 2
    agent: gem-implementer
    prototype: false
    covers: [AC2, AC3, AC6]
    priority: high
    status: pending
    dependencies:
      - perf-startup-lazy-providers
    conflicts_with: []
    context_files:
      - path: src/tts/tts_engine.py
        description: Central provider ownership and cache clearing already live here.
      - path: src/tts/providers/coqui_tts_provider.py
        description: clear_cache currently drops XTTS references and should be used when Coqui becomes inactive.
      - path: src/tts/providers/piper_tts_provider.py
        description: _loaded_models cache currently grows without eviction.
    planning_pass: 1
    planning_history:
      - pass: 1
        reason: Memory retention is a direct user complaint and can be reduced safely without changing synthesis output.
        timestamp: 2026-04-06T00:00:00Z
        estimated_effort: medium
        estimated_files: 3
        estimated_lines: 190
        focus_area: offline provider memory
        verification:
          - Run: python -m pytest -q tests/test_tts_engine_cache.py tests/test_piper_tts_provider.py tests/test_coqui_tts_provider.py
          - Add at least one deterministic mocked provider-lifecycle test that starts synthesis/preload, requests unload or cache clear mid-flight, and proves the inactive-state release is deferred until the in-flight operation completes.
          - Manually preview provider changes before saving, then synthesize once with Coqui, commit a switch back to Edge or Piper, and confirm inactive offline residency is released only after the committed transition or explicit cache clear and never during an in-flight synthesis/preload.
        acceptance_criteria:
          - Unsaved provider preview flows do not load or unload heavyweight provider model state.
          - Switching away from Coqui via a committed provider change, or using explicit cache clear, releases retained XTTS model references through the provider lifecycle path once no synthesis/preload is in flight.
          - Piper no longer keeps an unbounded in-memory set of loaded voice models; eviction policy is deterministic and low-risk.
          - A deterministic mocked lifecycle test covers unload-versus-in-flight preload/synthesis ordering so the riskiest concurrency path is regression-protected.
          - clear_voices_cache remains a reliable global escape hatch for all provider caches.
        failure_modes:
          - scenario: A stale reference outside the provider prevents real memory release.
            likelihood: medium
            impact: high
            mitigation: Centralize lifecycle transitions in TTSEngine and ensure provider-owned references are nulled through one path.
          - scenario: Cache clear or committed provider switch unloads model state while synthesis/preload is still active.
            likelihood: medium
            impact: high
            mitigation: Track in-flight synthesis/preload state and defer clear/unload until the active operation completes.
          - scenario: Piper eviction unloads a model still needed by the active synthesis request.
            likelihood: low
            impact: high
            mitigation: Evict only inactive entries after load/use bookkeeping and keep the cache size deliberately small but non-zero.
    tech_stack:
      - Python
      - coqui-tts
      - piper-tts
    test_coverage: Add/extend cache-clearing and eviction-focused provider tests around existing mocked suites, including a deterministic unload-versus-in-flight lifecycle regression.

