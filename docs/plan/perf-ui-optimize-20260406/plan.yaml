plan_id: perf-ui-optimize-20260406
objective: Fix UI sluggishness and excessive RAM usage with the smallest set of high-impact, low-risk, behavior-safe optimizations.
created_at: 2026-04-06T00:00:00Z
created_by: github-copilot-planner
status: pending_approval
research_confidence: high

plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 7
  risk_score: medium

tldr: |
  Focus first on PRD-aligned, behavior-preserving wins already supported by research:
  1) stop loading or retaining heavyweight offline TTS state unless actual offline synthesis or an explicit warm-up path requires it, while allowing committed provider changes to release inactive state,
  2) coalesce expensive text-edit work with incremental current-line highlighting plus latest-wins deferred analysis,
  3) remove duplicate non-streaming playback decode/copy work during segment playback.
  docs/PRD.yaml is the source of truth for scope, behavior preservation, and verification gates; no AGENTS.md was found.

acceptance_criteria:
  - id: AC1
    description: App startup no longer eagerly imports or constructs Coqui/Piper-heavy offline paths unless the active action actually needs them.
  - id: AC2
    description: Selecting Coqui in Settings does not preload or retain the XTTS model before the user actually synthesizes with Coqui, while preserving existing first-use status feedback.
  - id: AC3
    description: "Offline provider memory is safe and bounded: unsaved settings previews do not load or unload heavy model state, committed provider changes or explicit cache clears can release inactive models, Piper loaded-model memory is bounded by deterministic eviction, and in-flight synthesis/preload is not cleared mid-operation."
  - id: AC4
    description: Text editing remains behaviorally identical but uses incremental current-line highlighting plus latest-wins deferred expensive analysis instead of full-text/UI-thread work on every keystroke.
  - id: AC5
    description: Non-streaming playback, viseme, amplitude, and duration work avoid duplicate decode/copy work for the same audio segment while leaving streaming playback unchanged unless separately verified.
  - id: AC6
    description: Existing user-visible behavior for provider switching, voice indication, playback, visemes, amplitude updates, and offline synthesis output remains unchanged aside from improved responsiveness and lower memory use.
  - id: AC7
    description: A measurable execution gate records startup RSS, idle RSS by provider state, typing responsiveness, and playback overhead, and blocks completion if those checks do not improve or if behavior-preservation checks fail.

open_questions: []

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Lazy provider creation breaks provider-switch voice loading or cached voice refresh behavior.
      likelihood: medium
      impact: high
      mitigation: Preserve the current provider_override voice-list flow, add targeted provider-switch regression coverage, and keep provider metadata fetches independent from heavy model load.
    - scenario: Provider unload runs during an unsaved settings preview or while synthesis/preload is still in flight, causing model churn, race conditions, or failed offline playback.
      likelihood: medium
      impact: high
      mitigation: Only unload on committed provider change or explicit cache clear, treat provider_override preview as metadata-only, and guard clear/unload until active synthesis or preload finishes.
    - scenario: Debounced text updates leave the current-line highlight or auto-language indicator stale after rapid edits.
      likelihood: medium
      impact: medium
      mitigation: Only defer expensive recomputation, update the current line incrementally, commit only the latest scheduled analysis result, and smoke-test typing, caret moves, paste, and Enter/Shift+Enter behavior.
    - scenario: Shared decode preparation changes playback normalization, sample-rate handling, or viseme timing.
      likelihood: medium
      impact: high
      mitigation: Reuse the current decode/process pipeline, keep play_audio_streaming out of scope unless explicitly tested, add tests around duration/decode paths, and validate playback behavior with the existing audio-router-focused suite.
  assumptions:
    - docs/PRD.yaml is the source of truth for scope, acceptance criteria, and behavior-preservation requirements.
    - Behavior-safe improvements should avoid changing synthesis output, provider UX, or routing semantics beyond reducing unnecessary work.
    - Focused pytest suites are necessary but not sufficient; completion also requires measurable perf checks and behavior-preserving smoke coverage.

implementation_specification:
  code_structure: Keep changes localized to provider lifecycle management in TTSEngine/provider modules, UI event scheduling in MainWindow, and audio preparation/playback handoff in AudioRouter/MainWindow. Keep wave 1 surgical by lazy-creating heavyweight providers and removing eager Coqui preload first; add only a small committed-change/cache-clear lifecycle rule later instead of introducing a broad provider framework. Avoid large architectural rewrites or speculative background services.
  affected_areas:
    - main.py
    - src/tts/tts_engine.py
    - src/tts/providers/coqui_tts_provider.py
    - src/tts/providers/piper_tts_provider.py
    - src/gui/settings_window.py
    - src/gui/main_window.py
    - src/audio/audio_router.py
    - tests/test_tts_engine_cache.py
    - tests/test_voice_tab_provider_reload.py
    - tests/test_piper_tts_provider.py
    - tests/test_coqui_tts_provider.py
    - tests/test_audio_router.py
  component_details:
    - component: TTSEngine provider lifecycle
      responsibility: Instantiate heavyweight offline providers only when needed, preserve provider_override preview reads as metadata-only, expose a safe committed provider transition path, and centralize cache/unload hooks.
      interfaces:
        - "get_available_voices(provider_override: Optional[str] = None) -> List[Dict]"
        - "_get_provider_by_name(provider_name: str)"
        - "committed provider-change / clear-cache hook for inactive provider unload"
        - "clear_voices_cache() -> None"
    - component: Offline provider memory policy
      responsibility: Release Coqui XTTS residency only on committed provider change or explicit cache clear, guard against clearing while synthesis/preload is in flight, and keep Piper's in-memory loaded voice models bounded by deterministic eviction.
      interfaces:
        - "CoquiTTSProvider.clear_cache() -> None"
        - "PiperTTSProvider._load_voice(short_name: str) -> PiperVoice"
        - "PiperTTSProvider.clear_cache() -> None"
    - component: MainWindow text update scheduler
      responsibility: Replace full-document current-line retagging with incremental line updates and schedule expensive language-indicator work with latest-wins semantics so editing stays responsive without changing visible behavior.
      interfaces:
        - "_on_text_changed() -> None"
        - "_update_voice_indicator() -> None"
        - "_highlight_current_line() -> None"
    - component: AudioRouter prepared playback path
      responsibility: For non-streaming segment playback only, decode and process audio once per segment, then reuse prepared audio for duration, playback, and amplitude/viseme timing while leaving streaming playback unchanged.
      interfaces:
        - "_decode_audio_data(audio_data: bytes, target_sample_rate: Optional[int] = 48000) -> Tuple[np.ndarray, int]"
        - "get_audio_duration(audio_data: bytes) -> float"
        - "play_audio_to_device(...)"
        - "play_audio_with_amplitude(...)"
  dependencies:
    - component: MainWindow text update scheduler
      relationship: Reads TTSEngine language-detection helpers but must control call frequency from the UI thread.
    - component: TTSEngine provider lifecycle
      relationship: Owns provider instances and delegates unload/clear behavior to Coqui and Piper provider implementations.
    - component: AudioRouter prepared playback path
      relationship: Consumes raw segment bytes from MainWindow and returns timing/playback behavior used by viseme and output routing.
  integration_points:
    - SettingsWindow provider-change callback wiring
    - AdvancedTab clear-cache callback wiring
    - VoiceTab provider reload path
    - MainWindow key and caret event bindings
    - MainWindow playback path for spoken text and soundboard audio
    - Existing pytest suites for provider cache, provider reload, provider cache clearing, and audio decode behavior

