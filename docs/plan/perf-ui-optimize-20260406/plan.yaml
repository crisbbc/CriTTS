    title: Defer heavyweight offline provider setup until first real offline use
    description: |
      Keep wave 1 surgical: replace eager offline provider construction/import paths with lazy provider access in the TTS engine and remove the settings-window callback that preloads Coqui as soon as the user selects it in the UI.
      Preserve transient provider voice-list reloads by allowing metadata-only preview retrieval without loading XTTS or Piper runtime state, and keep existing first-use Coqui status feedback intact when synthesis actually starts.
    wave: 1
    agent: gem-implementer
    prototype: false
    covers: [AC1, AC2, AC6]
    priority: high
    status: completed
    dependencies: []
    conflicts_with: []
    context_files:
      - path: main.py
        description: App startup path currently constructs TTSEngine during initialization.
      - path: src/tts/tts_engine.py
        description: Current TTSEngine eagerly creates Edge, Coqui, and Piper provider instances in __init__.
      - path: src/gui/settings_window.py
        description: Provider-change callback currently preloads Coqui when selected in settings.
    planning_pass: 1
    planning_history:
      - pass: 1
        reason: Highest-impact, lowest-risk fix for startup RSS and surprise XTTS residency.
        timestamp: 2026-04-06T00:00:00Z
        estimated_effort: medium
        estimated_files: 3
        estimated_lines: 160
        focus_area: provider startup path
        verification:
          - Run: python -m pytest -q tests/test_tts_engine_cache.py tests/test_voice_tab_provider_reload.py
          - Manually open Settings, switch provider to Coqui, and confirm no background preload starts until an actual Coqui synthesis request while first-use load status messaging still appears when synthesis begins.
        acceptance_criteria:
          - TTSEngine no longer constructs heavyweight offline providers during app startup unless they are actually needed.
          - VoiceTab provider reload still works for edge, piper, and coqui selections before settings are saved.
          - Selecting Coqui in the Settings window alone does not trigger XTTS model preload/residency, and first-use status feedback is preserved when Coqui is actually invoked.
        failure_modes:
          - scenario: Lazy factory accidentally changes provider_override behavior and breaks live voice list reload.
            likelihood: medium
            impact: high
            mitigation: Preserve current get_available_voices(provider_override=...) behavior and cover it with existing provider reload/cache tests.
          - scenario: Status callback wiring no longer reaches Coqui after lazy provider creation.
            likelihood: low
