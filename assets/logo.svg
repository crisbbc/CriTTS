<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>CriTTS</title>
  <!-- App palette: slate 900 tile, emerald 400 mark (the Speak green, lightened for the dark tile). -->
  <rect width="256" height="256" rx="56" fill="#0f172a"/>
  <g fill="none" stroke="#34d399" stroke-linecap="round">
    <!-- The C: a 270 degree arc open to the right, toward the sound. -->
    <path d="M 145.25 82.75 A 64 64 0 1 0 145.25 173.25" stroke-width="34"/>
    <!-- Sound leaving the C. -->
    <path d="M 186.1 82 A 92 92 0 0 1 186.1 174" stroke-width="16"/>
    <path d="M 210.5 66 A 122 122 0 0 1 210.5 190" stroke-width="16" stroke-opacity="0.55"/>
  </g>
</svg>
